<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="108mm" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Mininet-IPLab: overall framework</title>
  <desc id="description">Four-layer Mininet-IPLab framework on one Linux host. Instructor and Learner icons are outside the shorter interaction layer, with access arrows to the Web UI. Control arrows connect the layers; green lines represent example virtual links.</desc>
  <defs>
<marker id="control-arrow" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L13 7 1 13Z" fill="#1d4ed8"/></marker>

    <symbol id="instructor-icon" viewBox="0 0 72 72">
      <circle cx="36" cy="36" r="34" fill="#e0e7ff" stroke="#475569" stroke-width="2"/>
      <rect x="35" y="12" width="27" height="24" rx="2" fill="#fff" stroke="#334155" stroke-width="2.4"/>
      <path d="M40 19h16 M40 25h11 M49 36v9" fill="none" stroke="#64748b" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M11 62v-9c0-10 7-16 16-16s16 6 16 16v9" fill="#2563eb" stroke="#1e3a8a" stroke-width="2.4"/>
      <circle cx="27" cy="25" r="10" fill="#fff" stroke="#1e293b" stroke-width="2.4"/>
      <path d="M21 38l6 8 6-8 M27 46v13 M41 48l12-14" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M44 44l13-16" fill="none" stroke="#334155" stroke-width="2.4" stroke-linecap="round"/>
    </symbol>
    <symbol id="learner-icon" viewBox="0 0 72 72">
      <circle cx="36" cy="36" r="34" fill="#ccfbf1" stroke="#475569" stroke-width="2"/>
      <path d="M15 61V51c0-10 8-16 21-16s21 6 21 16v10" fill="#0f766e" stroke="#134e4a" stroke-width="2.4"/>
      <circle cx="36" cy="23" r="10" fill="#fff" stroke="#1e293b" stroke-width="2.4"/>
      <path d="M17 45c8-2 14 0 19 4 5-4 11-6 19-4v17c-8-2-14 0-19 3-5-3-11-5-19-3Z" fill="#fff" stroke="#134e4a" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M36 49v15 M22 51l8 2 M42 53l8-2 M22 56l8 2 M42 58l8-2" fill="none" stroke="#0f766e" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="operator-icon" viewBox="0 0 72 72">
      <circle cx="36" cy="36" r="34" fill="#dbeafe" stroke="#475569" stroke-width="2"/>
      <circle cx="36" cy="22" r="10" fill="#fff" stroke="#1e293b" stroke-width="2.4"/>
      <path d="M15 56v-8c0-8 8-13 21-13s21 5 21 13v8" fill="#2563eb" stroke="#1e3a8a" stroke-width="2.4"/>
      <rect x="14" y="42" width="44" height="23" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2.4"/>
      <path d="M23 48l6 5-6 5 M35 58h10" fill="none" stroke="#1e3a8a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <style>
      text { font-family:"DejaVu Sans", Arial, sans-serif; fill:#182235; }
      .title { font-size:30px; font-weight:700; }
      .layer { font-size:21px; font-weight:700; }
      .head { font-size:24px; font-weight:700; }
      .body { font-size:20px; }
      .small { font-size:19px; }
      .actor { font-size:21px; font-weight:700; text-anchor:middle; }
      .control { fill:none; stroke:#1d4ed8; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#control-arrow); }
      .packet { fill:none; stroke:#15803d; stroke-width:4; }
    </style>
  </defs>
  <rect width="1200" height="720" fill="#fff"/>
  <text class="title" x="22" y="40">Mininet-IPLab: overall framework</text>
<rect x="18" y="68" width="938" height="168" rx="10" fill="#f8fafc" stroke="#6366f1" stroke-width="2"/>
