<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#0066cc"/>

  <!-- Terminal Prompt (>_) Top Left - Indented to x=10 -->
  <g stroke="white" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M10 12 L16 18 L10 24" />
    <line x1="20" y1="24" x2="26" y2="24" />
  </g>

  <!-- Links (Y-Topology) - Mininet Style -->
  <g stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
    <!-- Dashed connection from Controller (Top Right) to Switch (Center) -->
    <line x1="48" y1="18" x2="32" y2="34" stroke-dasharray="4,3"/>
    <!-- Solid connections to Hosts (Bottom) -->
    <line x1="32" y1="34" x2="16" y2="50" />
    <line x1="32" y1="34" x2="48" y2="50" />
  </g>

  <!-- Nodes (4 Rectangles) -->
  <!-- Top Right (Controller) -->
  <rect x="42" y="12" width="12" height="9" rx="2" fill="white"/>
  <!-- Center (Switch) -->
  <rect x="26" y="30" width="12" height="9" rx="2" fill="white"/>
  <!-- Bottom Left (Host 1) -->
  <rect x="10" y="46" width="12" height="9" rx="2" fill="white"/>
  <!-- Bottom Right (Host 2) -->
  <rect x="42" y="46" width="12" height="9" rx="2" fill="white"/>
</svg>
