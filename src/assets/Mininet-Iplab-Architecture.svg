<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="126mm" viewBox="0 0 1200 840" role="img" aria-labelledby="title description">
<title id="title">Mininet-IPLab: overall framework</title>
<desc id="description">Four layers on one Linux host. Instructor and Learner access Web UI from outside the shorter top layer. Local run_lab and the FastAPI SessionRegistry manage Labs. A LabHandle may be local or use Unix-socket RPC. Browser-launched Labs run in their own processes; Single-Lab Mode shares one Lab and Multi-Lab Mode provides one per Group. Each Lab owns a Mininet extension, Nodes, Services and runtime files. Node network, mount, PID and UTS namespaces share the host kernel; the exact namespace set depends on Node type.</desc>
<metadata>Source review: 2026-09-25, commit 9c14a8f. mniplab/runner.py; net.py; labhandle.py; labrpc.py; labprocess.py; lab_path.py; persistent_config.py; namespace.py; switch.py; webserver/services.py; webserver/groups.py; webserver/config.py.</metadata>
